case_id: colorado-river-post2026-allocation
title: "Colorado River post-2026 operating guidelines collapse leaves 40M people without agreed water rules"
utility_type: water
control_layer: basin_allocation
affected_jurisdiction:
  locality: "Southern Nevada (Las Vegas); Central Arizona (Phoenix, Tucson); Southern California (MWD service area)"
  state: "Nevada / Arizona / California (most acutely)"
controlling_actor: "U.S. Bureau of Reclamation / Upper Basin states (CO, WY, UT, NM)"
controlling_jurisdiction:
  locality: Washington
  state: "Federal / Upper Basin states"
trigger: >
  The 2007 Interim Guidelines governing Colorado River shortage-sharing expire
  end of 2026. Interior set a February 14, 2026 deadline for seven states to
  agree on successor rules. Upper Basin states refused to accept specific delivery
  cutbacks even during severe drought. The deadline was missed. Lower Basin
  proposed 27% cuts for AZ, 17% for NV, 10% for CA. No agreement reached.
  Tier 1 shortage in effect for 2026: Nevada gets 279,000 acre-feet (7% cut),
  Arizona loses 18%, California takes no cuts due to senior rights.
public_consequence: >
  2.3 million people in Southern Nevada get 90% of water from the Colorado River.
  Arizona's 7.1 million residents face the largest proportional cuts. No agreed
  framework means the Interior Secretary may impose unilateral cuts. Municipal
  water providers cannot plan capital investments without knowing future
  allocations. 40 million people basin-wide affected.
location:
  lng: -114.7
  lat: 36.0
affected_population_est: 40000000
current_status: >
  The seven basin states missed their deadline and the decision passed to the
  federal government. Reclamation published the Post-2026 Colorado River
  Reservoir Operations Final Environmental Impact Statement in the Federal
  Register on July 31, 2026, setting operations for Lake Powell and Lake Mead
  after the 2007 guidelines expire. For 2027-2028 it adopts the reductions the
  Lower Basin had proposed for itself; thereafter it revises guidelines at
  two-year intervals through 2036. It imposes no mandatory reductions on the
  Upper Basin. Each state was required to file a detailed conservation plan by
  August 2026.
