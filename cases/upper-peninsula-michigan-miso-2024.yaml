case_id: upper-peninsula-michigan-miso-2024
title: "Michigan Upper Peninsula electrically dependent on Wisconsin transmission within MISO"
utility_type: electricity
control_layer: transmission
affected_jurisdiction:
  locality: "Upper Peninsula (Marquette, Delta, Houghton, Iron, Baraga, Menominee counties)"
  state: Michigan
controlling_actor: "American Transmission Company (ATC) / MISO"
controlling_jurisdiction:
  locality: Pewaukee
  state: Wisconsin
trigger: >
  The UP's western two-thirds are electrically tied to northern Wisconsin via
  ATC's transmission system, not to Lower Michigan. ATC is headquartered in
  Wisconsin and majority-owned by Wisconsin utilities. Limited interconnections
  make the UP vulnerable to large outages — a 2011 lightning event during planned
  maintenance knocked out power to two-thirds of the peninsula. Data center load
  growth in Wisconsin is driving $1.3B+ in new transmission investment that UP
  ratepayers may subsidize through MISO cost allocation.
public_consequence: >
  ~300,000 residents depend on a transmission system owned and planned by a
  Wisconsin-based company, governed by a multi-state RTO headquartered in Indiana.
  ATC cannot provide firm service to some UP utilities due to transmission
  constraints. Wisconsin data center-driven buildout costs may be socialized to
  UP customers.
affected_population_est: 301000
