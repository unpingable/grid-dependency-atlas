case_id: pjm-data-center-cost-spillover-2025
title: "Virginia data center boom drives capacity cost explosion across 13 PJM states"
utility_type: electricity
control_layer: market_governance
affected_jurisdiction:
  locality: "13 states + D.C. (DE, IL, IN, KY, MD, MI, NJ, NC, OH, PA, TN, VA, WV)"
  state: "Multi-state (PJM footprint)"
controlling_actor: "PJM Interconnection / Virginia data center developers"
controlling_jurisdiction:
  locality: "Northern Virginia (Loudoun County) / Audubon, PA (PJM HQ)"
  state: "Virginia / Pennsylvania"
trigger: >
  Data centers concentrated in Virginia's Dominion zone drove an 833% increase
  in PJM capacity auction clearing prices from $28.92/MW-day (2024/25) to
  $269.92/MW-day (2025/26). Data centers accounted for 63% of the $9.3B cost
  increase and 94% of projected 32 GW demand growth through 2030. PJM's
  December 2025 auction fell 6,625 MW short of reliability requirements for the
  first time ever. From 2022-2024, $4.3B in transmission expansion costs for
  data center connections were socialized to ratepayers across 7 states.
public_consequence: >
  Residential ratepayers across 13 states pay for Virginia's data center growth:
  Pepco (D.C.) customers see $21/month increase, western Maryland $18/month,
  Ohio $16/month, Columbus OH $27/month. NRDC projects $100-163B in cumulative
  capacity costs through 2033. PJM's first-ever reliability shortfall means
  potential rolling blackouts. Customers in Ohio, Illinois, and West Virginia
  have no influence over Virginia's data center permitting.
current_status: >
  FERC opened a parallel colocation tariff proceeding (Docket EL25-49-000) via
  show-cause order on Dec 18, 2025, addressing whether data centers colocated
  with generation should bypass grid charges. March 25, 2026 protests from
  Vistra, Constellation Energy, and the Data Center Coalition criticized PJM's
  proposed framework as operationally rigid; replies due April 17, 2026.
  Separately, FERC's RM26-4-000 ANOPR on large-load (>20 MW) interconnection —
  directed by DOE Oct 2025 — is on a June 2026 action timeline.
