case_id: texas-uri-gas-electric-2021
title: "Winter Storm Uri gas-electric interdependency collapse in Texas"
utility_type: gas
control_layer: supply
affected_jurisdiction:
  locality: "Statewide (Houston, DFW, San Antonio, Austin metros)"
  state: Texas
controlling_actor: "ERCOT / Texas Railroad Commission / uncoordinated gas producers and pipeline operators"
controlling_jurisdiction:
  locality: Austin
  state: Texas
trigger: >
  February 2021 arctic blast caused cascading gas-electric interdependency
  failure. Permian Basin gas production dropped 85%. Gas compressors on
  interruptible electric contracts lost power during rolling blackouts, cutting
  gas supply to generators that needed gas to produce the electricity that
  powered the compressors. FERC/NERC found natural gas fuel supply issues
  accounted for 87% of all fuel-related generator outages.
public_consequence: >
  4.5 million+ homes and businesses lost power, many for days (average 42 hours).
  Official death toll: 246; independent estimates: 426-978 excess deaths. 69% of
  Texans lost power; 49% lost water service. Economic losses estimated at
  $80-130 billion (Federal Reserve Bank of Dallas).
location:
  lng: -97.7
  lat: 30.3
affected_population_est: 29000000
status: resolved
