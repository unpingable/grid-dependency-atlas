    date: "2026-03-05"
  - publisher: Portland Press Herald
    url: "https://www.pressherald.com/2026/02/20/natural-gas-prices-in-new-england-spiked-to-their-highest-level-ever-in-january/"
    date: "2026-02-20"
  - publisher: U.S. Department of Energy
    url: "https://www.energy.gov/articles/energy-department-extends-emergency-order-new-england-ahead-second-winter-storm"
    date: "2026-02-05"
one_line: >
  New England's gas pipelines were built for heating, not power generation; every
  cold winter, heating gets priority and 15 million electricity customers pay
  massive price spikes because no New England entity controls pipeline capacity
  decisions made by FERC-regulated interstate operators.
