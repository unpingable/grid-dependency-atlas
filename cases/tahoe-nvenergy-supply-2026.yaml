case_id: tahoe-nvenergy-supply-2026
title: "NV Energy declines continued full-requirements supply to Liberty Utilities at Lake Tahoe"
utility_type: electricity
control_layer: wholesale_contract
affected_jurisdiction:
  locality: "Lake Tahoe basin (South Lake Tahoe, Tahoe City, surrounding communities)"
  state: California
controlling_actor: "NV Energy"
controlling_jurisdiction:
  locality: Las Vegas
  state: Nevada
trigger: >
  NV Energy informed Liberty Utilities it would not extend the full-requirements
  wholesale supply arrangement past its May 31, 2027 termination, citing its own
  resource needs. Liberty currently gets ~75% of its power from NV Energy. The
  northern Nevada market is now "extremely competitive" due to Tahoe-Reno
  Industrial Center data center load growth, and transmission for new
  interconnections is severely constrained.
public_consequence: >
  49,000 California customers face a rushed wholesale resupply process covering
  ~75% of Liberty's Tahoe-region supply. Liberty must procure replacement power
  before the May 31, 2027 contract termination and has asked California
  regulators for expedited approval. Customers will absorb whatever replacement
  costs emerge. Greenlink Nevada transmission relief lands after the gap opens —
  Greenlink West in-service slipped to May 2027, Greenlink North to late 2028 —
  so upstream capacity relief arrives too late to help. Because Liberty's
  territory sits in the NV Energy balancing authority — not CAISO — the community
  has no access to California's main grid reliability programs.
current_status: >
  Liberty filed at CPUC in March 2026 seeking expedited authorization to run an
  RFP for replacement supply; formal RFP planned for summer 2026. Replacement
  power likely sourced outside California and wheeled over NV Energy transmission.
