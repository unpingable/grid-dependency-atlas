case_id: pacificorp-california-balancing-2022
title: "PacifiCorp's 46,000 California customers governed by six-state balancing authority outside CAISO"
utility_type: electricity
control_layer: balancing
affected_jurisdiction:
  locality: "Del Norte, Modoc, Shasta, and Siskiyou counties"
  state: California
controlling_actor: "PacifiCorp (Berkshire Hathaway Energy)"
controlling_jurisdiction:
  locality: Portland
  state: Oregon
trigger: >
  PacifiCorp operates its own balancing authority (PACW) spanning six states;
  California customers sit outside CAISO. Wildfire liabilities totaling $2.2B+
  in settlements are being recovered across PacifiCorp's multi-state rate base,
  and $1.7B in wildfire costs are being pushed into FERC-jurisdictional
  transmission rates that wholesale customers must absorb.
public_consequence: >
  Northern California customers have no representation in CAISO governance,
  cannot access CAISO reliability programs, and face rate exposure from wildfire
  liabilities incurred across PacifiCorp's six-state territory. Utah wholesale
  customers face a 32-45% transmission rate increase from wildfire costs while
  PacifiCorp's own retail customers in Salt Lake City pay nothing toward wildfire
  liability.
