case_id: entergy-miso-south-nola-blackout-2025
title: "New Orleans blackout exposes Entergy's multi-state transmission underinvestment under MISO governance"
utility_type: electricity
control_layer: transmission
affected_jurisdiction:
  locality: "Greater New Orleans (Orleans, Jefferson, St. Bernard, Plaquemines, St. Tammany parishes)"
  state: Louisiana
controlling_actor: "Entergy Corporation / MISO"
controlling_jurisdiction:
  locality: "New Orleans, LA (Entergy HQ) / Carmel, IN (MISO HQ)"
  state: "Louisiana / Indiana"
trigger: >
  On May 25, 2025, MISO ordered Entergy to shed 498 MW of load across Greater
  New Orleans with only 30 minutes' warning after River Bend nuclear plant
  (1,035 MW) tripped and multiple gas plants were down. Entergy's four-state
  territory has blocked MISO long-range transmission planning — not one MISO
  LRTP line has been built in Entergy's territory, and MISO South planning won't
  begin until 2026 with earliest construction around 2036.
public_consequence: >
  100,000+ customers lost power during Memorial Day weekend. The outage was not
  caused by extreme weather — it was a normal Sunday. The Amite South load pocket
  has had limited transmission import capability since at least 2006. New Orleans
  City Council regulates Entergy locally but has no authority over MISO's
  reliability decisions or Entergy's multi-state transmission investment priorities.
