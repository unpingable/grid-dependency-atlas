case_id: doe-202c-emergency-orders-2025
title: "DOE Section 202(c) emergency orders socialize coal-retention costs across 11 MISO states"
utility_type: electricity
control_layer: federal_override
affected_jurisdiction:
  locality: "11 MISO states (cost-allocation footprint)"
  state: "MI, IN, IL, WI, MN, IA, MO, KY, AR, MS, LA"
controlling_actor: "U.S. Department of Energy"
controlling_jurisdiction:
  locality: "Washington, D.C."
  state: D.C.
trigger: >
  DOE issued 43+ Section 202(c) emergency orders since May 2025 directing
  utilities to keep coal plants running past planned retirement against utility
  and state objection. Cumulative impact: ≥4.4 GW of coal capacity kept online
  as of April 2026. Notable: J.H. Campbell (Consumers Energy, MI; 1,560 MW;
  closure planned 15 years ahead of schedule), Centralia Unit 2 (WA; 730 MW;
  state SB 5769 mandated Dec 31 closure), R.M. Schahfer Units 17 & 18 (NIPSCO,
  IN; ~423 MW each; order extended through March 23, 2026).
public_consequence: >
  Compliance costs from a utility-by-utility order socialize across the regional
  RTO footprint. Consumers Energy reported $135M in Campbell compliance costs
  (end-May through Dec 2025) which it intends to recover from ratepayers across
  11 MISO states — Michigan, Indiana, Illinois, Wisconsin, Minnesota, Iowa,
  Missouri, Kentucky, Arkansas, Mississippi, Louisiana — none of whom have any
  vote over the DOE order or the Michigan utility's retirement plan. The
  federal lever overrides state retirement timelines while pushing the bill
  outward through the RTO cost-allocation mechanism.
callout: >
  In litigation over the J.H. Campbell order, DOE has told the court that an
  "emergency" under Federal Power Act section 202(c) need not be imminent. If
  that reading stands, the statutory trigger this case documents has no
  temporal limit: the override stops being an emergency power and becomes an
  ordinary one, renewable indefinitely, with the cost socialised through the
  RTO each time.
current_status: >
  DOE Order 202-26-22, issued May 18, 2026, directs MISO in coordination with
  Consumers Energy to keep the J.H. Campbell coal plant in West Olive, Michigan
  available, running May 19 to August 16, 2026 — the latest in a chain of
  renewals rather than a single emergency. Consumers Energy has spent about
  $254M keeping Campbell running and has asked FERC for permission to recover
  $135M of it from MISO ratepayers. Sierra Club's analysis puts the cost of 13
  such orders at more than $235M to date. MISO state regulators have sought a
  stakeholder review of how those costs are allocated. In litigation over the
  Campbell order, DOE has told the court that an "emergency" under section
  202(c) need not be imminent. Grid Strategies estimates that extending the
  practice to other pre-2028 retirements could exceed $3B a year.
