case_id: potomac-interceptor-collapse-2026
title: "Potomac Interceptor sewer collapse releases 240M gallons of untreated sewage into Potomac River"
utility_type: sewer
control_layer: treatment
affected_jurisdiction:
  locality: "Loudoun County, Fairfax County, Town of Vienna, Town of Herndon, Montgomery County"
  state: "Virginia / Maryland"
controlling_actor: "DC Water (District of Columbia Water and Sewer Authority)"
controlling_jurisdiction:
  locality: Washington
  state: "District of Columbia"
trigger: >
  A section of the 54-mile, 60-year-old, 72-inch Potomac Interceptor sewer line
  ruptured on January 19, 2026, along Clara Barton Parkway in Montgomery County,
  MD, near the C&O Canal National Historical Park. Virginia and Maryland suburbs
  send ~60 MGD of sewage through this DC Water-owned pipe they cannot maintain
  or inspect.
public_consequence: >
  ~240 million gallons of untreated wastewater released into the Potomac and its
  tributaries over 8 days — early estimates ranged as high as 300 million — one
  of the largest sewage spills in U.S. history. DC Water bypassed sewage through
  a dry stretch of the C&O Canal, itself polluting the national park. E. coli
  levels hundreds of times above EPA safety limits. Health advisories across DC,
  MD, and VA. Recreation shut down for months. Emergency bypass took five days;
  full flow not restored until March 14, 2026.
current_status: >
  Repairs completed and the interceptor returned to service on March 14, 2026,
  after 55 days of mitigation. On April 20-21, 2026 the Justice Department (for
  EPA) and Maryland's Attorney General filed parallel Clean Water Act
  complaints. Maryland alleges DC Water was negligent: the pipe showed signs of
  corrosion, DC Water failed to properly assess the risk, and capital
  improvements were delayed. The federal complaint seeks penalties, sewer
  assessment and rehabilitation work, and pollutant mitigation. No settlement
  has been reached as of August 2026. DC Water has asked for streamlined
  environmental review to speed rehabilitation of the line; an earlier request
  for a categorical exclusion on this section was not approved. In May 2026 DC
  Water disclosed that three further segments of the 54-mile interceptor need
  urgent repair.
